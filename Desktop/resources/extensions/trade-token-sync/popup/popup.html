<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Trade Token Sync</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<div id="header">
			<img src="../images/icon-128-white.png" />
			Trade Token Sync
		</div>

		<div id="partner-site-template">
			<div class="row mt-4 mb-1">
				<div class="column">
					<a href="#" class="partner-site-link partner-site-name" target="_blank"></a>
				</div>
				<div class="column">
					<a href="https://steamcommunity.com" target="_blank">Steam</a>
				</div>
			</div>

			<div class="row">
				<div class="column">
					<a href="#" class="partner-site-link" target="_blank">
						<span class="status-badge status-badge-partner"></span>
					</a>
				</div>
				<div class="column">
					<a href="https://steamcommunity.com" target="_blank">
						<span class="status-badge status-badge-steam"></span>
					</a>
				</div>
			</div>

			<div class="row mb-0">
				<div class="column">
					<div class="tree-box partner"></div>
				</div>
				<div class="column">
					<div class="tree-box steam"></div>
				</div>
			</div>

			<div class="row">
				<div class="column full">
					<div class="tree-branch vertical tree-final"></div>
				</div>
			</div>

			<div class="row mb-4">
				<div class="column full">
					<span class="status-badge status-badge-final"></span>
				</div>
			</div>

			<div class="row mb-4">
				<div class="column full">
					<a href="#" class="link support-link" target="_blank">Need help?</a>
				</div>
			</div>
		</div>
		<div id="partner-sites"></div>

		<script src="popup.js"></script>
	</body>
</html>
